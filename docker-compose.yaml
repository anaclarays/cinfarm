services:
    backend:
        container_name: backend_cinfarm
        image: cinfarm-backend:prod
        build:
          context: ./apps/backend
          target: prod
        ports: 
          - '8000:8000'
        environment:
          POSTGRES_USER: ${POSTGRES_USER:-postgres}
          POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
          POSTGRES_DB: ${POSTGRES_DB:-db_cinfarm}
          POSTGRES_HOST: database
          POSTGRES_PORT: "5432"
        healthcheck:
          test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')"]
          interval: 10s
          timeout: 3s
          retries: 3
        depends_on:
          database:
            condition: service_healthy
        networks:
          - private-network
          - database-network

    frontend:
        container_name: frontend_cinfarm
        image: cinfarm-frontend:prod
        build:
          context: ./apps/frontend
          target: prod
        ports:
          - '5173:5173'
        healthcheck:
          test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:5173']
          interval: 10s
          timeout: 3s
          retries: 3
        networks:
          - private-network

    database:
        container_name: database_cinfarm
        image: postgres:17
        restart: unless-stopped
        environment:
          POSTGRES_USER: ${POSTGRES_USER:-postgres}
          POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
          POSTGRES_DB: ${POSTGRES_DB:-db_cinfarm}
        ports:
          - "15432:5432"
        volumes:
          - pgdata:/var/lib/postgresql/data
        healthcheck:
          test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-db_cinfarm}"]
          interval: 10s
          timeout: 3s
          retries: 5
        networks:
          - database-network

    pgadmin:
        container_name: pgadmin_cinfarm
        image: dpage/pgadmin4:9.19
        restart: unless-stopped
        environment:
          PGADMIN_DEFAULT_EMAIL: "${PGADMIN_EMAIL:-admin@cinfarm.com}"
          PGADMIN_DEFAULT_PASSWORD:  "${PGADMIN_PASSWORD:-Password123!}"
        volumes:
          - pgadmin-data:/var/lib/pgadmin
        ports:
          - "16543:80"
        depends_on:
          - database
        networks:
          - database-network

    nginx:
        container_name: nginx_cinfarm
        image: nginx:stable-alpine3.24
        restart: unless-stopped
        ports:
          - '80:80'
        volumes:
          - ./apps/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        depends_on:
          backend:
            condition: service_healthy
          frontend:
            condition: service_healthy
        networks:
          - public-network
          - private-network

networks:
    private-network:
        driver: bridge
    public-network:
        driver: bridge
    database-network:
        driver: bridge

volumes:
    pgdata:
    pgadmin-data:
    backend_volume:
    frontend_volume:
