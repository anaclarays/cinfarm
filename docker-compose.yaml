services:
    backend:
        container_name: backend_cinfarm
        build:
          context: ./apps/backend
          target: dev
        ports: '8000:8000'
        user: '${UID:-1000}:${GID:-1000}'
        environment:
          CHOKIDAR_USEPOLLING: 'true'
          WATCHPACK_POLLING: 'true'
        volumes:
          - .:/app
          - .venv:/app/.venv
        healthcheck:
          test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:8000']
          interval: 10s
          timeout: 3s
          retries: 3

    database:
        container_name: database_cinfarm
        image: postgres:latest
        environment:
          POSTGRES_PASSWORD: "Password123!"
        ports:
          - "15432:5432"
        volumes:
          - pgdata:/var/lib/postgresql/data
        networks:
          - postgres-compose-network

    pgadmin:
        container_name: pgadmin_cinfarm
        image: dpage/pgadmin4:latest
        restart: unless-stopped
        environment:
        PGADMIN_DEFAULT_EMAIL: "c.contato@gmail.com"
        PGADMIN_DEFAULT_PASSWORD: "Password123!"
        volumes:
        - pgadmin-data:/var/lib/pgadmin
        ports:
        - "16543:80"
        networks:
        - database-network

    nginx:
        container_name: nginx_cinfarm
        image: nginx:stable-alpine3.24

networks:
    database-network:
        driver: bridge

volumes:
    pgdata:
    pgadmin-data:
    .venv:
