services:
    backend:
        container_name: backend_dev_cinfarm
        build:
          context: ./apps/backend
          target: dev
        ports: 
          - '8000:8000'
        user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
        environment:
          POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
          POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
          POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
          POSTGRES_HOST: database
          POSTGRES_PORT: "5432"
        volumes:
          - ./apps/backend:/app
          - backend_volume:/app/.venv
        healthcheck:
          test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000')"]
          interval: 10s
          timeout: 3s
          retries: 3
        depends_on:
          database:
            condition: service_healthy
        networks:
          - private-network
          - database-network

    frontend:
        container_name: frontend_dev_cinfarm
        build:
          context: ./apps/frontend
          target: dev
        ports: 
          - '5173:5173'
        user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
        environment:
          CHOKIDAR_USEPOLLING: 'true'
          WATCHPACK_POLLING: 'true'
        volumes:
          - ./apps/frontend:/app
          - frontend_volume:/app/node_modules
        healthcheck:
          test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:5173']
          interval: 10s
          timeout: 3s
          retries: 3
        networks:
          - private-network

    database:
        container_name: database_dev_cinfarm
        image: postgres:17
        restart: unless-stopped
        environment:
          POSTGRES_USER: "${POSTGRES_USER:-postgres}"
          POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
          POSTGRES_DB: "${POSTGRES_DB:-db_cinfarm}"
        ports:
          - "15432:5432"
        volumes:
          - pgdata:/var/lib/postgresql/data
        healthcheck:
          test: ["CMD-SHELL", "pg_isready -U postgres -d db_cinfarm"]
          interval: 10s
          timeout: 3s
          retries: 5
        networks:
          - database-network

    pgadmin:
        container_name: pgadmin_dev_cinfarm
        image: dpage/pgadmin4:9.19
        restart: unless-stopped
        environment:
          PGADMIN_DEFAULT_EMAIL: "${PGADMIN_EMAIL:?PGADMIN_EMAIL is required}"
          PGADMIN_DEFAULT_PASSWORD:  "${PGADMIN_PASSWORD:?PGADMIN_PASSWORD is required}"
        volumes:
          - pgadmin-data:/var/lib/pgadmin
        ports:
          - "16543:80"
        depends_on:
          - database
        networks:
          - database-network

    nginx:
        container_name: nginx_dev_cinfarm
        image: nginx:stable-alpine3.24
        restart: unless-stopped
        ports:
          - '80:80'
        volumes:
          - ./apps/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        depends_on:
          - backend
          - frontend
        networks:
          - public-network
          - private-network

networks:
    private-network:
        driver: bridge
    public-network:
        driver: bridge
    database-network:
        driver: bridge

volumes:
    pgdata:
    pgadmin-data:
    backend_volume:
    frontend_volume:
